<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5EFE6"/>
      <stop offset="1" stop-color="#ECE3D2"/>
    </linearGradient>
    <pattern id="contours" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0,30 Q15,20 30,30 T60,30" fill="none" stroke="#1B2233" stroke-width="0.6" opacity="0.18"/>
      <path d="M0,45 Q15,35 30,45 T60,45" fill="none" stroke="#1B2233" stroke-width="0.6" opacity="0.10"/>
    </pattern>
    <pattern id="marker" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#E55934"/>
      <line x1="0" y1="0" x2="6" y2="6" stroke="#F5EFE6" stroke-width="0.8"/>
      <line x1="6" y1="0" x2="0" y2="6" stroke="#F5EFE6" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Cream paper background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#contours)"/>

  <!-- Left accent rule -->
  <line x1="80" y1="80" x2="80" y2="550" stroke="#C8451F" stroke-width="3"/>

  <!-- Marker + eyebrow -->
  <rect x="120" y="115" width="14" height="14" fill="url(#marker)"/>
  <text x="148" y="129" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" letter-spacing="3" fill="#6B6356">// SOFTWARE ENGINEER</text>

  <!-- Italic "I'm" -->
  <text x="120" y="220" font-family="'Times New Roman', Times, ui-serif, Georgia, serif" font-style="italic" font-size="64" fill="#C8451F">I'm</text>

  <!-- Giant "Rushabh" -->
  <text x="120" y="350" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="124" font-weight="800" letter-spacing="-3" fill="#1B1A17">Rushabh</text>

  <!-- Subtitle -->
  <text x="120" y="400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#3A352D">Backend Systems · Agentic Systems · Edge AI</text>

  <!-- Tagline block (mono, accent) -->
  <text x="120" y="475" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" fill="#C8451F">$ multi-agent systems</text>
  <text x="120" y="505" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" fill="#3A352D">$ retrieval-augmented products</text>

  <!-- Footer -->
  <text x="120" y="585" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" fill="#6B6356">rushabh-kalme.vercel.app · github.com/JustRK-07</text>

  <!-- Marker hint at corner -->
  <rect x="1080" y="555" width="20" height="20" fill="url(#marker)"/>
</svg>
